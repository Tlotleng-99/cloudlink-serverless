
AWSTemplateFormatVersion: '2010-09-09'
Description: CloudLink URL shortener - Lambda, API Gateway and DynamoDB

Resources:
  UrlMappingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloudlink-url-mappings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shortCode
          AttributeType: S
        - AttributeName: urlHash
          AttributeType: S
      KeySchema:
        - AttributeName: shortCode
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: urlHash-index
          KeySchema:
            - AttributeName: urlHash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CloudLinkApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: cloudlink-api
      Description: CloudLink URL shortener API
      EndpointConfiguration:
        Types:
          - REGIONAL

  CloudLinkLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudLinkDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt UrlMappingsTable.Arn
                  - !Sub '${UrlMappingsTable.Arn}/index/*'

  CreateUrlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudlink-create-url
      Runtime: java17
      Handler: com.cloudlink.functions.CreateUrlLambda::handleRequest
      Role: !GetAtt CloudLinkLambdaRole.Arn
      Timeout: 15
      MemorySize: 512
      Code:
        S3Bucket: REPLACE_WITH_DEPLOYMENT_BUCKET
        S3Key: cloudlink.jar
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlMappingsTable

  RedirectUrlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudlink-redirect-url
      Runtime: java17
      Handler: com.cloudlink.functions.RedirectUrlLambda::handleRequest
      Role: !GetAtt CloudLinkLambdaRole.Arn
      Timeout: 15
      MemorySize: 512
      Code:
        S3Bucket: REPLACE_WITH_DEPLOYMENT_BUCKET
        S3Key: cloudlink.jar
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlMappingsTable

  StatsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudlink-stats
      Runtime: java17
      Handler: com.cloudlink.functions.StatsLambda::handleRequest
      Role: !GetAtt CloudLinkLambdaRole.Arn
      Timeout: 15
      MemorySize: 512
      Code:
        S3Bucket: REPLACE_WITH_DEPLOYMENT_BUCKET
        S3Key: cloudlink.jar
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlMappingsTable

  CreateUrlResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudLinkApi
      ParentId: !GetAtt CloudLinkApi.RootResourceId
      PathPart: urls

  CreateUrlMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudLinkApi
      ResourceId: !Ref CreateUrlResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt CreateUrlFunction.Arn

  ShortCodeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudLinkApi
      ParentId: !GetAtt CloudLinkApi.RootResourceId
      PathPart: '{shortCode}'

  RedirectMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudLinkApi
      ResourceId: !Ref ShortCodeResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt RedirectUrlFunction.Arn

  StatsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudLinkApi
      ParentId: !GetAtt CloudLinkApi.RootResourceId
      PathPart: stats

  StatsCodeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudLinkApi
      ParentId: !Ref StatsResource
      PathPart: '{shortCode}'

  StatsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudLinkApi
      ResourceId: !Ref StatsCodeResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt StatsFunction.Arn

  CreateUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateUrlFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudLinkApi}/*/POST/urls'

  RedirectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RedirectUrlFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudLinkApi}/*/GET/*'

  StatsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StatsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudLinkApi}/*/GET/stats/*'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateUrlMethod
      - RedirectMethod
      - StatsMethod
    Properties:
      RestApiId: !Ref CloudLinkApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudLinkApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

Outputs:
  ApiBaseUrl:
    Description: Base URL for the deployed CloudLink API
    Value: !Sub 'https://${CloudLinkApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod'
  DynamoDBTableName:
    Value: !Ref UrlMappingsTable
