<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    
    <title>CloudLink-Serverless</title>   
    <!-- Navigation section-->

    <header>
        <div>CloudLink</div>
        <button id="DarkButton">Dark_Mode_Button</button>
    </header>
    <main>
           <!-- Hero section-->
        <section id="Hero">
            <h1>Shorten your URLs. Share smarter.</h1>
            <p>Create short, simple and trackable links with CloudLink.</p>
            <label>Enter your URL here</label>
            <input type="url" id="urlInput">
            <button id="ShortenButton">submit</button>
        </section>

        <!--- Features section-->
        <section id="Features">
            <div class="featurecard">icon_1
            <h3>Fast</h3>
            <p>This is where we create our Urls</p>
            </div>
           

            <div class="featurecard">icon_2
            <h3>Analytics</h3>
            <p>Click tracker</p>
            </div>
           

            <div class="featurecard">icon_3
            <h3>Reliable</h3>
            <p>Secure and scalable</p>
            </div>
            
         
        </section>
           <!--- Result section-->
        <section id="responses">
            <h2> Your Short URL</h2>
            <p id="shortenurl">Short Url</p>
            <button id="copyingbutton">Copy Button</button>
        </section>
    </main>
    <footer>
        copyright reserved @
    </footer>
</head>

</body>
</html>
